<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-lg border-0 overflow-hidden" style="max-width: 900px; border-radius: 15px;">
    <div class="row g-0">
      <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center bg-white p-4">
        <img src="logo-bg.png" alt="Medical Team" class="img-fluid">
      </div>
      <div class="col-md-6 p-5 bg-white">
        <div class="text-center mb-4">
          <div class="mb-2">
            <i class="bi bi-intersect text-primary" style="font-size: 2rem;"></i>
            <h5 class="fw-bold text-secondary">Centro Médico</h5>
          </div>
          <h2 class="fw-bold mt-3">Bienvenido</h2>
          <p class="text-muted">Por favor
            Ingrese sus credenciales
          </p>
        </div>
        <form (ngSubmit)="onLogin()">
          <div class="mb-4">
            <label class="form-label fw-semibold">Correo Electrónico</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0">
                <i class="bi bi-envelope text-primary"></i>
              </span>
              <input type="email" class="form-control border-start-0" [(ngModel)]="email" name="email"
                placeholder="nombre@ejemplo.com" required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0">
                <i class="bi bi-lock text-primary"></i>
              </span>
              <input type="password" class="form-control border-start-0" [(ngModel)]="password" name="password"
                placeholder="••••••••" required>
            </div>
          </div>

          @if(error()){
            <div class="alert alert-danger py-2 small">
              <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error() }}
            </div>
          }
          
          <button class="btn btn-primary w-100 py-2 fw-bold shadow-sm mt-3" type="submit"
            style="background-color: #17a2b8; border: none;"
            [disabled]="cargando()">
            
            @if (!cargando()) {
              <span>Iniciar Sesión</span>
            } @else {
              <span>
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Autenticando...
              </span>
            }
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
