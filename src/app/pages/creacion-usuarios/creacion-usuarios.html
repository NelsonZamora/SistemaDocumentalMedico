<div class="container mt-4">

  <div class="row">

    <div class="col-md-4">

      <div class="card shadow-sm border-0">

        <div class="card-body">

          <h4 class="mb-4">
            👤 Crear Usuario
          </h4>

          <div class="mb-3">

            <label class="form-label">
              Nombre completo
            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="nombre_completo"
            />

          </div>

          <div class="mb-3">

            <label class="form-label">
              Correo
            </label>

            <input
              type="email"
              class="form-control"
              [(ngModel)]="email"
            />

          </div>

          <div class="mb-3">

            <label class="form-label">
              Contraseña
            </label>

            <input
              type="password"
              class="form-control"
              [(ngModel)]="password"
            />

          </div>

          <div class="mb-4">

            <label class="form-label">
              Rol
            </label>

            <select
              class="form-select"
              [(ngModel)]="rol"
            >

              <option value="medico">
                Médico
              </option>

              <option value="admin">
                Administrador
              </option>

            </select>

          </div>

          <button
            class="btn btn-primary w-100"
            [disabled]="creando"
            (click)="crearUsuario()"
          >

            @if (!creando) {
              Crear usuario
            }

            @if (creando) {
              Creando...
            }

          </button>

        </div>

      </div>

    </div>

    <div class="col-md-8">

      <div class="card shadow-sm border-0">

        <div class="card-body">

          <h4 class="mb-4">
            📋 Usuarios registrados
          </h4>

          @if (cargando) {

            <div class="text-center py-5">

              <div class="spinner-border text-primary">
              </div>

            </div>

          }

          @if (!cargando) {

            <div class="table-responsive">

              <table class="table align-middle">

                <thead class="table-light">

                  <tr>
                    <th>Nombre</th>
                    <th>Rol</th>
                    <th>Fecha</th>
                  </tr>

                </thead>

                <tbody>

                  @for (
                    usuario of usuarios;
                    track usuario.id
                  ) {

                    <tr>

                      <td>

                        {{
                          usuario.nombre_completo
                        }}

                      </td>

                      <td>

                        <span
                          class="badge"
                          [class.bg-primary]="
                            usuario.rol === 'admin'
                          "
                          [class.bg-success]="
                            usuario.rol === 'medico'
                          "
                        >

                          {{ usuario.rol }}

                        </span>

                      </td>

                      <td>

                        {{
                          usuario.actualizado_at
                          | date:'short'
                        }}

                      </td>

                    </tr>

                  }

                </tbody>

              </table>

            </div>

          }

        </div>

      </div>

    </div>

  </div>

</div>
